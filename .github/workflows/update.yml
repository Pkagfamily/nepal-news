name: Update news
on:
  schedule:
    - cron: "5,25,45 * * * *"      # each job loops ~50 min; the next one waits in line, so news never stops
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/update.yml"]
permissions:
  contents: write
  actions: write        # lets each run start the next one (GitHub's timer alone skips runs)
  models: read          # GitHub's AI models (backup writer)
concurrency:
  group: news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install
        run: |
          mkdir -p /tmp/logs
          (pip install -q setuptools wheel && pip install -q -r scripts/requirements.txt) > /tmp/logs/install.txt 2>&1 || (cat /tmp/logs/install.txt; exit 1)
      - name: Get the last published news
        run: |
          git fetch -q origin feed --depth=1 && git worktree add -q out FETCH_HEAD || mkdir -p out
      - name: Read the sites, write new stories in English, publish (every ~5 minutes)
        env:
          NEWS_SECRET: ${{ secrets.NEWS_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_PUSH: ${{ github.token }}
          REPO: ${{ github.repository }}
          OUT_DIR: out
          RUN_SECONDS: "130"
        run: scripts/cycle.sh
      - name: Start the next run straight away (keeps the news flowing without gaps)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml -R ${{ github.repository }} --ref main || true
      - name: Weekly heartbeat (keeps GitHub's schedule switched on)
        run: |
          W=$(date -u +%G-W%V)
          if [ "$(cat heartbeat.txt 2>/dev/null)" != "$W" ]; then
            echo "$W" > heartbeat.txt
            git add heartbeat.txt
            git -c user.name=news-robot -c user.email=robot@local commit -qm "heartbeat $W"
            git push -q origin HEAD:main || true
          fi
      - name: Save log for checking
        if: always()
        run: |
          cp out/status.json /tmp/logs/ 2>/dev/null || true
          cd /tmp/logs && rm -rf .git
          git init -q -b logs
          git add -A
          git -c user.name=news-robot -c user.email=robot@local commit -qm "log ${{ github.run_id }} ${{ job.status }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" logs
