name: Probe official sites
on:
  push:
    branches: [main]
    paths: ["probe/**", ".github/workflows/probe.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: probe/run.sh
        env:
          GH_PUSH: ${{ github.token }}
          REPO: ${{ github.repository }}
